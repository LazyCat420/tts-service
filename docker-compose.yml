version: '3.8'

services:
  tts-service:
    image: tts-service:latest
    container_name: tts-service
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - PIPER_MODELS_DIR=/app/data/piper_models
    volumes:
      - /volume1/docker/tts-models:/app/data/piper_models
    ports:
      - "3032:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
